</div>

<script>
"use strict";


/*
    ==========================================
    GAPINO API
    ==========================================
*/

const API_BASE_URL =
    "https://gapino3.onrender.com";


/*
    ==========================================
    DOM
    ==========================================
*/

const registerForm =
    document.getElementById(
        "registerForm"
    );

const usernameInput =
    document.getElementById(
        "username"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const toggleConfirmPassword =
    document.getElementById(
        "toggleConfirmPassword"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );

const messageBox =
    document.getElementById(
        "message"
    );


/*
    ==========================================
    Message
    ==========================================
*/

function showMessage(
    text,
    type = "error"
) {
    messageBox.textContent =
        text;

    messageBox.className =
        "message show " +
        type;
}

function hideMessage() {
    messageBox.textContent =
        "";

    messageBox.className =
        "message";
}


/*
    ==========================================
    Loading
    ==========================================
*/

function setLoading(
    loading
) {
    registerButton.disabled =
        loading;

    if (loading) {

        registerButton.innerHTML =
            '<span class="spinner"></span>در حال ثبت نام...';

    } else {

        registerButton.textContent =
            "ثبت نام";
    }
}


/*
    ==========================================
    Password toggle
    ==========================================
*/

togglePassword.addEventListener(
    "click",
    () => {

        const isPassword =
            passwordInput.type ===
            "password";

        passwordInput.type =
            isPassword
                ? "text"
                : "password";

        togglePassword.textContent =
            isPassword
                ? "🙈"
                : "👁";

    }
);

toggleConfirmPassword.addEventListener(
    "click",
    () => {

        const isPassword =
            confirmPasswordInput.type ===
            "password";

        confirmPasswordInput.type =
            isPassword
                ? "text"
                : "password";

        toggleConfirmPassword.textContent =
            isPassword
                ? "🙈"
                : "👁";

    }
);


/*
    ==========================================
    Register
    ==========================================
*/

registerForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        hideMessage();


        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /*
            اعتبارسنجی نام کاربری
        */

        if (!username) {

            showMessage(
                "نام کاربری را وارد کنید.",
                "error"
            );

            usernameInput.focus();

            return;
        }


        if (username.length < 3) {

            showMessage(
                "نام کاربری باید حداقل ۳ کاراکتر باشد.",
                "error"
            );

            usernameInput.focus();

            return;
        }


        /*
            اعتبارسنجی رمز
        */

        if (!password) {

            showMessage(
                "رمز عبور را وارد کنید.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        if (password.length < 6) {

            showMessage(
                "رمز عبور باید حداقل ۶ کاراکتر باشد.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        /*
            تطبیق رمزها
        */

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "رمز عبور و تکرار آن یکسان نیست.",
                "error"
            );

            confirmPasswordInput.focus();

            return;
        }


        setLoading(true);


        /*
            FormData
        */

        const formData =
            new FormData();

        formData.append(
            "username",
            username
        );

        formData.append(
            "password",
            password
        );


        try {

            /*
                ارسال مستقیم به Render
            */

            const response =
                await fetch(
                    `${API_BASE_URL}/register`,
                    {
                        method: "POST",

                        body: formData,

                        credentials:
                            "include",

                        cache:
                            "no-store"
                    }
                );


            let data = null;


            try {

                data =
                    await response.json();

            } catch (_) {

                data = null;

            }


            /*
                خطای سرور
            */

            if (!response.ok) {

                showMessage(
                    data?.message ||
                    "ثبت نام انجام نشد.",
                    "error"
                );

                setLoading(false);

                return;
            }


            /*
                ثبت نام موفق
            */

            showMessage(
                "ثبت نام با موفقیت انجام شد. در حال انتقال به صفحه ورود...",
                "success"
            );


            /*
                ذخیره اطلاعات کاربر
                فقط اگر سرور اطلاعات کاربر بدهد.
            */

            if (
                data &&
                data.user &&
                data.user.id
            ) {

                localStorage.setItem(
                    "gapino_user",
                    JSON.stringify(
                        data.user
                    )
                );

            }


            /*
                بسیار مهم:
                صفحه login داخل خود APK باز می‌شود.
            */

            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                700
            );

        } catch (error) {

            console.error(
                "GAPINO register error:",
                error
            );


            showMessage(
                "خطا در اتصال به سرور GAPINO. اتصال اینترنت را بررسی کنید.",
                "error"
            );


            setLoading(false);

        }

    }
);


/*
    ==========================================
    شروع
    ==========================================
*/

window.addEventListener(
    "load",
    () => {

        usernameInput.focus();

    }
);

</script>

</body>
