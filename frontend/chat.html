```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAPINO Chat</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="chat.css"
    >

</head>


<body>


<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top">

        <div id="profile">
            GAPINO
        </div>


        <button
            id="menuBtn"
            type="button"
            aria-label="منوی کاربران"
        >
            ☰
        </button>

    </header>


    <!-- =========================
         USERS PANEL
    ========================== -->

    <aside id="usersPanel">

        <h3>
            کاربران
        </h3>

        <div id="usersList">

        </div>

    </aside>


    <!-- =========================
         CHAT
    ========================== -->

    <main class="chat">


        <!-- CHAT HEADER -->

        <div id="chatHeader">

            انتخاب کاربر

        </div>


        <!-- =========================
             MESSAGES
        ========================== -->

        <div id="messages">


        </div>


        <!-- =========================
             TYPING INDICATOR
        ========================== -->

        <div
            id="typingIndicator"
        >
            در حال نوشتن...
        </div>


        <!-- =========================
             REPLY BOX
        ========================== -->

        <div
            id="replyBox"
            style="display:none;"
        >

            <span id="replyText">

            </span>


            <button
                id="cancelReply"
                type="button"
            >
                ×
            </button>

        </div>


        <!-- =========================
             INPUT AREA
        ========================== -->

        <div class="inputArea">


            <!-- FILE -->

            <input
                type="file"
                id="fileInput"
                hidden
            >


            <!-- MESSAGE INPUT -->

            <input
                id="messageInput"
                type="text"
                autocomplete="off"
                placeholder="پیام..."
            >


            <!-- PHOTO -->

            <button
                id="photoBtn"
                type="button"
                aria-label="ارسال عکس"
            >
                📷
            </button>


            <!-- VOICE -->

            <button
                id="voiceBtn"
                type="button"
                aria-label="ارسال صدا"
            >
                🎤
            </button>


            <!-- SEND -->

            <button
                id="sendBtn"
                type="button"
                aria-label="ارسال پیام"
            >
                ➤
            </button>


        </div>


    </main>


</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="chat.js"></script>


</body>

</html>
```
