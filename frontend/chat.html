<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>GAPINO Chat</title>

<link rel="stylesheet" href="chat.css">

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="top">

        <div id="profile">
            GAPINO
        </div>

        <button id="menuBtn">
            ☰
        </button>

    </header>





    <!-- USERS -->

    <aside id="usersPanel">


        <h3>
            کاربران
        </h3>


        <div id="usersList">

        </div>


    </aside>






    <!-- CHAT -->

    <main class="chat">


        <div id="chatHeader">

            انتخاب کاربر

        </div>




        <div id="messages">


        </div>






        <!-- REPLY BOX -->

        <div id="replyBox"
        style="display:none;">


            <span id="replyText">

            </span>


            <button id="cancelReply">

                ×

            </button>


        </div>







        <!-- INPUT -->

        <div class="inputArea">


            <input
            id="messageInput"
            placeholder="پیام..." />



            <input
            type="file"
            id="fileInput"
            hidden>



            <button id="photoBtn">

                📷

            </button>





            <button id="voiceBtn">

                🎤

            </button>





            <button id="sendBtn">

                ➤

            </button>


        </div>



    </main>


</div>





<script src="chat.js"></script>


</body>

</html>
