<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
ساخت حساب GAPINO
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
135deg,
#edf4ff,
#dce8ff
);

font-family:
Tahoma,
Arial;

padding:20px;

}



.box{

width:100%;

max-width:420px;

background:white;

padding:30px;

border-radius:24px;

box-shadow:
0 20px 60px
rgba(0,0,0,.12);

}



.logo{

width:80px;

height:80px;

margin:auto;

border-radius:20px;

background:
linear-gradient(
135deg,
#4f7cff,
#315bdc
);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:bold;

}



h1{

text-align:center;

color:#1d2940;

}



input{

width:100%;

height:52px;

margin-top:12px;

border:

1px solid #dce2ed;

border-radius:14px;

padding:0 15px;

font-size:16px;

}



button{

width:100%;

height:52px;

margin-top:15px;

border:0;

border-radius:14px;

background:
linear-gradient(
135deg,
#4f7cff,
#315bdc
);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



button:disabled{

opacity:.6;

}



.message{

text-align:center;

margin-top:15px;

line-height:1.8;

}



.error{

color:#d33;

}



.success{

color:#198754;

}



.hide{

display:none;

}



a{

display:block;

text-align:center;

margin-top:20px;

color:#315bdc;

text-decoration:none;

}


</style>

</head>


<body>


<div class="box">


<div class="logo">
GAP
</div>



<h1>
ساخت حساب GAPINO
</h1>



<input

id="username"

placeholder="نام کاربری"

>



<input

id="mobile"

placeholder="09120000000"

>



<button id="sendCode">

ارسال کد

</button>




<div id="codeBox" class="hide">


<input

id="code"

placeholder="کد ۶ رقمی"

>



<button id="verifyCode">

تایید کد و ساخت حساب

</button>



</div>




<div

id="message"

class="message"

></div>




<a href="login.html">

ورود به حساب

</a>


</div>





<script>


const API =
"";



const username =
document.getElementById(
"username"
);


const mobile =
document.getElementById(
"mobile"
);


const code =
document.getElementById(
"code"
);


const sendButton =
document.getElementById(
"sendCode"
);


const verifyButton =
document.getElementById(
"verifyCode"
);


const codeBox =
document.getElementById(
"codeBox"
);


const message =
document.getElementById(
"message"
);





function showMessage(
text,
type=""
){

message.textContent =
text;

message.className =
"message " + type;

}







// =======================
// SEND CODE
// =======================


sendButton.onclick =
async ()=>{


let phone =
mobile.value.trim();



if(!/^09\d{9}$/.test(phone)){


showMessage(
"شماره موبایل اشتباه است",
"error"
);

return;

}



sendButton.disabled=true;



const form =
new FormData();


form.append(
"mobile",
phone
);



try{


const res =
await fetch(

API+"/send-code",

{

method:"POST",

body:form

}

);



const data =
await res.json();



if(data.success){


showMessage(
"کد ارسال شد",
"success"
);


codeBox.classList.remove(
"hide"
);



}

else{


showMessage(
data.message,
"error"
);


}



}catch(e){


showMessage(
"خطا در ارتباط با سرور",
"error"
);


}



sendButton.disabled=false;


};









// =======================
// VERIFY + REGISTER
// =======================


verifyButton.onclick =
async ()=>{


let phone =
mobile.value.trim();


let otp =
code.value.trim();



if(!otp){


showMessage(
"کد را وارد کنید",
"error"
);


return;

}




// VERIFY


let verifyForm =
new FormData();


verifyForm.append(
"mobile",
phone
);


verifyForm.append(
"code",
otp
);



try{


let verify =
await fetch(

API+"/verify-code",

{

method:"POST",

body:verifyForm

}

);



let verifyData =
await verify.json();



if(!verifyData.success){


showMessage(
verifyData.message,
"error"
);


return;

}





// REGISTER


let registerForm =
new FormData();


registerForm.append(

"username",

username.value.trim()

);



registerForm.append(

"mobile",

phone

);





let register =
await fetch(

API+"/register",

{

method:"POST",

body:registerForm

}

);




let registerData =
await register.json();





if(registerData.success){


showMessage(

"حساب ساخته شد. انتقال به ورود...",

"success"

);



setTimeout(()=>{


location.href =
"login.html";


},1000);



}else{


showMessage(

registerData.message,

"error"

);


}



}catch(e){


showMessage(
"خطای سرور",
"error"
);


}



};



</script>


</body>

</html>
