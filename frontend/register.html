<body>

<div class="box">

    <div class="logo">
        GAP
    </div>

    <h1>
        ساخت حساب GAPINO
    </h1>


    <input
        id="username"
        type="text"
        autocomplete="username"
        maxlength="30"
        placeholder="نام کاربری"
    >

    <div class="hint">
        فقط حروف انگلیسی، عدد، نقطه، خط تیره و زیرخط مجاز است.
    </div>


    <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="09120000000"
    >


    <input
        id="password"
        type="password"
        autocomplete="new-password"
        maxlength="128"
        placeholder="رمز عبور"
    >

    <div class="hint">
        رمز عبور باید حداقل ۶ کاراکتر باشد.
    </div>


    <input
        id="password2"
        type="password"
        autocomplete="new-password"
        maxlength="128"
        placeholder="تکرار رمز عبور"
    >


    <button
        id="registerButton"
        type="button"
    >
        ساخت حساب
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <a href="login.html">
        قبلاً حساب ساخته‌ام
    </a>

</div>


<script>

const API =
    "https://gapino3.onrender.com";


const username =
    document.getElementById("username");

const mobile =
    document.getElementById("mobile");

const password =
    document.getElementById("password");

const password2 =
    document.getElementById("password2");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


function showMessage(
    text,
    type = ""
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}


function normalizePhone(
    value
){

    let phone =
        value
        .trim()
        .replace(/\s+/g, "");


    if(
        phone.startsWith("+98")
    ){

        phone =
            "0" +
            phone.slice(3);

    }

    else if(
        phone.startsWith("98")
    ){

        phone =
            "0" +
            phone.slice(2);

    }


    return phone;
}


async function register(){

    const user =
        username.value.trim();

    const phone =
        normalizePhone(
            mobile.value
        );

    const pass =
        password.value;

    const pass2 =
        password2.value;


    if(
        user.length < 3
    ){

        showMessage(
            "نام کاربری باید حداقل ۳ کاراکتر باشد",
            "error"
        );

        username.focus();

        return;
    }


    if(
        !/^[a-zA-Z0-9._-]+$/.test(user)
    ){

        showMessage(
            "نام کاربری نامعتبر است",
            "error"
        );

        username.focus();

        return;
    }


    if(
        !/^09\d{9}$/.test(phone)
    ){

        showMessage(
            "شماره موبایل اشتباه است",
            "error"
        );

        mobile.focus();

        return;
    }


    if(
        pass.length < 6
    ){

        showMessage(
            "رمز عبور باید حداقل ۶ کاراکتر باشد",
            "error"
        );

        password.focus();

        return;
    }


    if(
        pass !== pass2
    ){

        showMessage(
            "تکرار رمز عبور صحیح نیست",
            "error"
        );

        password2.focus();

        return;
    }


    registerButton.disabled =
        true;


    showMessage(
        "در حال ساخت حساب...",
        ""
    );


    const form =
        new FormData();


    form.append(
        "username",
        user
    );


    form.append(
        "mobile",
        phone
    );


    form.append(
        "password",
        pass
    );


    try{

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                20000
            );


        const response =
            await fetch(
                API + "/register",
                {
                    method:"POST",

                    body:form,

                    cache:"no-store",

                    credentials:"include",

                    signal:
                        controller.signal
                }
            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        if(
            !data.success
        ){

            registerButton.disabled =
                false;


            showMessage(
                data.message ||
                "ساخت حساب ناموفق بود",
                "error"
            );

            return;
        }


        showMessage(
            "حساب با موفقیت ساخته شد",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "login.html";

            },
            800
        );


    }

    catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        registerButton.disabled =
            false;


        if(
            error.name === "AbortError"
        ){

            showMessage(
                "زمان اتصال به سرور تمام شد",
                "error"
            );

        }

        else{

            showMessage(
                "خطا در ارتباط با سرور",
                "error"
            );

        }

    }

}


registerButton.onclick =
    register;


username.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            mobile.focus();

        }

    }
);


mobile.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            password.focus();

        }

    }
);


password.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            password2.focus();

        }

    }
);


password2.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            register();

        }

    }
);

</script>

</body>

</html>
