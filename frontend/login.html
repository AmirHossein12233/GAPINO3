<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ورود GAPINO
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
135deg,
#edf4ff,
#dce8ff
);

font-family:
Tahoma,
Arial;

padding:20px;

}



.box{

width:100%;

max-width:420px;

background:white;

padding:30px;

border-radius:24px;

box-shadow:
0 20px 60px
rgba(0,0,0,.12);

}



.logo{

width:80px;

height:80px;

margin:auto;

border-radius:20px;

background:
linear-gradient(
135deg,
#4f7cff,
#315bdc
);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:bold;

}



h1{

text-align:center;

color:#1d2940;

}



input{

width:100%;

height:52px;

margin-top:12px;

border:

1px solid #dce2ed;

border-radius:14px;

padding:0 15px;

font-size:16px;

}



button{

width:100%;

height:52px;

margin-top:15px;

border:0;

border-radius:14px;

background:
linear-gradient(
135deg,
#4f7cff,
#315bdc
);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



button:disabled{

opacity:.6;

}



.message{

text-align:center;

margin-top:15px;

line-height:1.8;

}



.error{

color:#d33;

}



.success{

color:#198754;

}



.hide{

display:none;

}



a{

display:block;

text-align:center;

margin-top:20px;

color:#315bdc;

text-decoration:none;

}


</style>


</head>


<body>


<div class="box">


<div class="logo">
GAP
</div>


<h1>
ورود GAPINO
</h1>




<input

id="mobile"

type="tel"

placeholder="09120000000"

>



<button id="sendCode">

ارسال کد ورود

</button>





<div id="codeBox" class="hide">


<input

id="code"

placeholder="کد ۶ رقمی"

>


<button id="loginButton">

ورود

</button>


</div>





<div id="message" class="message"></div>




<a href="register.html">

ساخت حساب جدید

</a>



</div>





<script>


const API = "http://localhost:8000";



const mobile =
document.getElementById(
"mobile"
);


const code =
document.getElementById(
"code"
);



const sendCode =
document.getElementById(
"sendCode"
);



const loginButton =
document.getElementById(
"loginButton"
);



const codeBox =
document.getElementById(
"codeBox"
);



const message =
document.getElementById(
"message"
);





function showMessage(
text,
type=""
){

message.textContent =
text;


message.className =
"message " + type;

}






// =====================
// SEND CODE
// =====================


sendCode.onclick =
async ()=>{


const phone =
mobile.value.trim();



if(!/^09\d{9}$/.test(phone)){


showMessage(
"شماره موبایل اشتباه است",
"error"
);


return;

}



const form =
new FormData();



form.append(
"mobile",
phone
);



try{


const res =
await fetch(

API+"/send-code",

{

method:"POST",

body:form

}

);



const data =
await res.json();





if(data.success){


showMessage(
"کد ارسال شد",
"success"
);



codeBox.classList.remove(
"hide"
);



}

else{


showMessage(
data.message,
"error"
);


}



}catch(e){


showMessage(
"خطا در ارتباط با سرور",
"error"
);


}


};









// =====================
// VERIFY + LOGIN
// =====================


loginButton.onclick =
async ()=>{


const phone =
mobile.value.trim();


const otp =
code.value.trim();




if(!otp){


showMessage(
"کد را وارد کنید",
"error"
);


return;

}






// VERIFY CODE


const verifyForm =
new FormData();


verifyForm.append(
"mobile",
phone
);



verifyForm.append(
"code",
otp
);




try{


const verify =
await fetch(

API+"/verify-code",

{

method:"POST",

body:verifyForm

}

);



const verifyData =
await verify.json();





if(!verifyData.success){


showMessage(
verifyData.message,
"error"
);


return;

}





// LOGIN


const loginForm =
new FormData();


loginForm.append(

"mobile",

phone

);





const login =
await fetch(

API+"/login",

{

method:"POST",

body:loginForm,

credentials:"include"

}

);





const loginData =
await login.json();






if(loginData.success){


showMessage(
"ورود موفق. انتقال...",
"success"
);



localStorage.setItem(

"gapino_user",

JSON.stringify(
loginData.user
)

);





setTimeout(()=>{


location.href =
"chat.html";


},1000);




}else{


showMessage(

loginData.message,

"error"

);


}





}catch(e){


showMessage(
"خطای سرور",
"error"
);


}




};



</script>


</body>

</html>
