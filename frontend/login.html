<body>

<div class="box">

    <div class="logo">
        GAP
    </div>

    <h1>
        ورود GAPINO
    </h1>

    <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="09120000000"
    >

    <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="رمز عبور"
    >

    <button
        id="loginButton"
        type="button"
    >
        ورود
    </button>

    <div
        id="message"
        class="message"
    ></div>

    <a href="register.html">
       اگه حساب نداری ساخت حساب جدید
    </a>

</div>


<script>

const API =
    "https://gapino3.onrender.com";


const mobile =
    document.getElementById("mobile");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(
    text,
    type = ""
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}


function normalizePhone(
    value
){

    let phone =
        value
        .trim()
        .replace(/\s+/g, "");


    if(
        phone.startsWith("+98")
    ){

        phone =
            "0" +
            phone.slice(3);

    }

    else if(
        phone.startsWith("98")
    ){

        phone =
            "0" +
            phone.slice(2);

    }


    return phone;
}


async function login(){

    const phone =
        normalizePhone(
            mobile.value
        );

    const pass =
        password.value;


    if(
        !/^09\d{9}$/.test(phone)
    ){

        showMessage(
            "شماره موبایل اشتباه است",
            "error"
        );

        return;
    }


    if(
        pass.length < 1
    ){

        showMessage(
            "رمز عبور را وارد کنید",
            "error"
        );

        return;
    }


    loginButton.disabled =
        true;


    showMessage(
        "در حال ورود...",
        ""
    );


    const form =
        new FormData();


    form.append(
        "mobile",
        phone
    );

    form.append(
        "password",
        pass
    );


    try{

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                20000
            );


        const response =
            await fetch(
                API + "/login",
                {
                    method:"POST",

                    body:form,

                    credentials:"include",

                    cache:"no-store",

                    signal:
                        controller.signal
                }
            );


        clearTimeout(
            timeout
        );


        const data =
            await response.json();


        if(
            !data.success
        ){

            loginButton.disabled =
                false;


            showMessage(
                data.message ||
                "ورود ناموفق بود",
                "error"
            );

            return;
        }


        localStorage.setItem(
            "gapino_user",
            JSON.stringify(
                data.user
            )
        );


        showMessage(
            "ورود موفق. انتقال...",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "chat.html";

            },
            500
        );


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        loginButton.disabled =
            false;


        if(
            error.name === "AbortError"
        ){

            showMessage(
                "زمان اتصال به سرور تمام شد",
                "error"
            );

        }

        else{

            showMessage(
                "خطا در ارتباط با سرور",
                "error"
            );

        }

    }

}


loginButton.onclick =
    login;


mobile.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            password.focus();

        }

    }
);


password.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);

</script>

</body>
