<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | GAPINO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #dce9ff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        button,
        input {
            font-family: inherit;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            background: #fff;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 82px;
            height: 82px;

            margin: 0 auto 18px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #4f7cff,
                    #315bdc
                );

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: 900;

            box-shadow:
                0 10px 30px
                rgba(49, 91, 220, 0.25);
        }

        h1 {
            margin: 0;

            text-align: center;

            color: #1c2740;

            font-size: 27px;
        }

        .subtitle {
            margin:
                10px 0 25px;

            text-align: center;

            color: #778199;

            font-size: 14px;

            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #35415c;

            font-weight: bold;

            font-size: 14px;
        }

        input {
            width: 100%;

            height: 52px;

            border:
                1px solid #dce2ed;

            border-radius: 14px;

            padding: 0 15px;

            outline: none;

            background: #f9fbff;

            color: #1d2940;

            font-size: 16px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #4f7cff;

            background: #fff;

            box-shadow:
                0 0 0 4px
                rgba(
                    79,
                    124,
                    255,
                    0.10
                );
        }

        .submit-button {
            width: 100%;

            height: 54px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #4f7cff,
                    #315bdc
                );

            color: #fff;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-button:hover {
            transform:
                translateY(-1px);
        }

        .submit-button:disabled {
            opacity: .65;

            cursor: wait;

            transform: none;
        }

        .secondary-button {
            width: 100%;

            height: 48px;

            margin-top: 10px;

            border:
                1px solid #dce2ed;

            border-radius: 14px;

            background:
                #f7f9fc;

            color:
                #47536b;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .secondary-button:hover {
            background:
                #eef2f8;
        }

        .message {
            min-height: 24px;

            margin-top: 14px;

            text-align: center;

            font-size: 13px;

            line-height: 1.8;
        }

        .message.error {
            color: #d33b3b;
        }

        .message.success {
            color: #218838;
        }

        .message.info {
            color: #52627d;
        }

        .hidden {
            display: none !important;
        }

        .code-info {
            margin-bottom: 15px;

            padding: 12px;

            border-radius: 12px;

            background:
                #f4f7ff;

            color:
                #52627d;

            font-size: 12px;

            line-height: 1.8;

            text-align: center;
        }

        .timer {
            margin-top: 10px;

            text-align: center;

            color: #667085;

            font-size: 12px;
        }

        .bottom {
            margin-top: 20px;

            text-align: center;

            color: #778199;

            font-size: 14px;
        }

        .link-button {
            border: 0;

            background: transparent;

            color: #315bdc;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .login-box {
                padding: 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<main class="login-box">

    <div class="logo">
        GAP
    </div>

    <h1>
        ورود به GAPINO
    </h1>

    <div class="subtitle">
        با نام کاربری و کد تأیید وارد شوید
    </div>

    <!-- مرحله اول -->

    <section id="usernameStep">

        <div class="form-group">

            <label for="username">
                نام کاربری
            </label>

            <input
                id="username"
                name="username"
                type="text"
                maxlength="30"
                autocomplete="username"
                placeholder="نام کاربری"
                required
            >

        </div>

        <button
            id="sendCodeButton"
            class="submit-button"
            type="button"
        >
            ارسال کد تأیید
        </button>

    </section>


    <!-- مرحله دوم -->

    <section
        id="codeStep"
        class="hidden"
    >

        <div class="code-info">

            کد تأیید به شماره موبایل ثبت‌شده
            برای این حساب ارسال شد.

        </div>

        <div class="form-group">

            <label for="verificationCode">
                کد تأیید
            </label>

            <input
                id="verificationCode"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                placeholder="کد ۶ رقمی"
            >

        </div>

        <button
            id="verifyCodeButton"
            class="submit-button"
            type="button"
        >
            تأیید و ورود
        </button>

        <button
            id="changeUsernameButton"
            class="secondary-button"
            type="button"
        >
            تغییر نام کاربری
        </button>

        <div
            id="timer"
            class="timer"
        ></div>

        <button
            id="resendButton"
            class="secondary-button hidden"
            type="button"
        >
            ارسال دوباره کد
        </button>

    </section>


    <div
        id="loginMessage"
        class="message"
        aria-live="polite"
    ></div>


      <div class="bottom">

    اگه حساب نداری؟

    <button
        id="registerButton"
        class="link-button"
        type="button"
    >
        ساخت حساب
    </button>

</div>

</main>.


<script>

"use strict";


const API =
    "https://gapino3.onrender.com";


const usernameStep =
    document.getElementById(
        "usernameStep"
    );

const codeStep =
    document.getElementById(
        "codeStep"
    );

const usernameInput =
    document.getElementById(
        "username"
    );

const verificationCodeInput =
    document.getElementById(
        "verificationCode"
    );

const sendCodeButton =
    document.getElementById(
        "sendCodeButton"
    );

const verifyCodeButton =
    document.getElementById(
        "verifyCodeButton"
    );

const changeUsernameButton =
    document.getElementById(
        "changeUsernameButton"
    );

const resendButton =
    document.getElementById(
        "resendButton"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );


let currentUsername = "";

let resendTimer = null;

let resendSeconds = 0;


function showMessage(
    text,
    type = "info"
) {

    if (!loginMessage) {
        return;
    }

    loginMessage.textContent =
        String(text || "");

    loginMessage.className =
        "message " + type;
}


function setButtonLoading(
    button,
    loading,
    normalText,
    loadingText
) {

    if (!button) {
        return;
    }

    button.disabled =
        Boolean(loading);

    button.textContent =
        loading
            ? loadingText
            : normalText;
}


async function readJson(
    response
) {

    const text =
        await response.text();

    if (!text) {
        return null;
    }

    try {
        return JSON.parse(
            text
        );
    } catch {
        return null;
    }
}


function saveUser(
    user
) {

    if (
        !user ||
        !user.id
    ) {
        return;
    }

    try {

        localStorage.setItem(
            "gapino_user",
            JSON.stringify(user)
        );

    } catch (error) {

        console.warn(
            "SAVE USER ERROR:",
            error
        );
    }
}


function getSavedUser() {

    try {

        const raw =
            localStorage.getItem(
                "gapino_user"
            );

        if (!raw) {
            return null;
        }

        const user =
            JSON.parse(
                raw
            );

        return (
            user &&
            user.id
        )
            ? user
            : null;

    } catch {

        return null;
    }
}


function showCodeStep() {

    usernameStep.classList.add(
        "hidden"
    );

    codeStep.classList.remove(
        "hidden"
    );

    verificationCodeInput.value = "";

    verificationCodeInput.focus();

    startResendTimer(
        60
    );
}


function showUsernameStep() {

    codeStep.classList.add(
        "hidden"
    );

    usernameStep.classList.remove(
        "hidden"
    );

    verificationCodeInput.value = "";

    usernameInput.focus();

    stopResendTimer();

    timerElement.textContent = "";

    resendButton.classList.add(
        "hidden"
    );
}


function startResendTimer(
    seconds
) {

    stopResendTimer();

    resendSeconds =
        Number(seconds) || 60;

    updateTimer();

    resendTimer =
        setInterval(() => {

            resendSeconds -= 1;

            updateTimer();

            if (
                resendSeconds <= 0
            ) {

                stopResendTimer();

                resendButton.classList.remove(
                    "hidden"
                );

                timerElement.textContent =
                    "اکنون می‌توانید کد را دوباره ارسال کنید.";
            }

        }, 1000);
}


function updateTimer() {

    if (!timerElement) {
        return;
    }

    if (resendSeconds > 0) {

        timerElement.textContent =
            `ارسال دوباره کد تا ${resendSeconds} ثانیه دیگر`;

    } else {

        timerElement.textContent = "";
    }
}


function stopResendTimer() {

    if (resendTimer) {

        clearInterval(
            resendTimer
        );

        resendTimer = null;
    }
}


async function requestCode() {

    const username =
        String(
            usernameInput.value || ""
        ).trim();

    if (!username) {

        showMessage(
            "نام کاربری را وارد کنید.",
            "error"
        );

        usernameInput.focus();

        return;
    }


    setButtonLoading(
        sendCodeButton,
        true,
        "ارسال کد تأیید",
        "در حال ارسال..."
    );

    showMessage(
        "در حال ارسال کد تأیید...",
        "info"
    );


    const formData =
        new FormData();

    formData.append(
        "username",
        username
    );


    try {

        const response =
            await fetch(
                API +
                "/login/request-code",
                {
                    method:
                        "POST",

                    body:
                        formData,

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await readJson(
                response
            );


        if (!response.ok) {

            throw new Error(
                data?.message ||
                data?.detail ||
                `خطای سرور: ${response.status}`
            );
        }


        currentUsername =
            username;


        showCodeStep();


        showMessage(
            data?.message ||
            "کد تأیید ارسال شد.",
            "success"
        );


    } catch (error) {

        console.error(
            "REQUEST OTP ERROR:",
            error
        );

        showMessage(
            error.message ||
            "ارسال کد انجام نشد.",
            "error"
        );

    } finally {

        setButtonLoading(
            sendCodeButton,
            false,
            "ارسال کد تأیید",
            "در حال ارسال..."
        );
    }
}


async function verifyCode() {

    const username =
        currentUsername ||
        String(
            usernameInput.value || ""
        ).trim();

    const code =
        String(
            verificationCodeInput.value || ""
        ).trim();


    if (!username) {

        showUsernameStep();

        showMessage(
            "نام کاربری را وارد کنید.",
            "error"
        );

        return;
    }


    if (!/^\d{6}$/.test(code)) {

        showMessage(
            "کد تأیید باید ۶ رقمی باشد.",
            "error"
        );

        verificationCodeInput.focus();

        return;
    }


    setButtonLoading(
        verifyCodeButton,
        true,
        "تأیید و ورود",
        "در حال بررسی..."
    );


    showMessage(
        "در حال بررسی کد...",
        "info"
    );


    const formData =
        new FormData();

    formData.append(
        "username",
        username
    );

    formData.append(
        "code",
        code
    );


    try {

        const response =
            await fetch(
                API +
                "/login/verify-code",
                {
                    method:
                        "POST",

                    body:
                        formData,

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await readJson(
                response
            );


        if (!response.ok) {

            throw new Error(
                data?.message ||
                data?.detail ||
                `خطای سرور: ${response.status}`
            );
        }


        if (
            !data ||
            data.success !== true ||
            !data.user ||
            !data.user.id
        ) {

            throw new Error(
                "پاسخ ورود از سرور نامعتبر است."
            );
        }


        saveUser(
            data.user
        );


        showMessage(
            "ورود موفق بود...",
            "success"
        );


        stopResendTimer();


        setTimeout(
            () => {

                window.location.replace(
                    "chat.html"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "VERIFY OTP ERROR:",
            error
        );

        showMessage(
            error.message ||
            "کد تأیید صحیح نیست.",
            "error"
        );

    } finally {

        setButtonLoading(
            verifyCodeButton,
            false,
            "تأیید و ورود",
            "در حال بررسی..."
        );
    }
}


if (sendCodeButton) {

    sendCodeButton.addEventListener(
        "click",
        requestCode
    );
}


if (verifyCodeButton) {

    verifyCodeButton.addEventListener(
        "click",
        verifyCode
    );
}


if (changeUsernameButton) {

    changeUsernameButton.addEventListener(
        "click",
        () => {

            currentUsername = "";

            showUsernameStep();

            showMessage(
                "",
                "info"
            );

        }
    );
}


if (resendButton) {

    resendButton.addEventListener(
        "click",
        requestCode
    );
}


if (verificationCodeInput) {

    verificationCodeInput.addEventListener(
        "input",
        () => {

            verificationCodeInput.value =
                verificationCodeInput.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

            if (
                verificationCodeInput.value.length === 6
            ) {
                verifyCode();
            }

        }
    );


    verificationCodeInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                verifyCode();
            }

        }
    );
}


if (usernameInput) {

    usernameInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                requestCode();
            }

        }
    );

}


if (registerButton) {

    registerButton.addEventListener(
        "click",
        () => {

            window.location.href =
                "register.html";

        }
    );
}


async function restoreExistingLogin() {

    const savedUser =
        getSavedUser();

    if (!savedUser) {
        return;
    }


    try {

        const response =
            await fetch(
                API + "/me",
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await readJson(
                response
            );


        if (
            response.ok &&
            data?.authenticated === true &&
            data?.user?.id
        ) {

            saveUser(
                data.user
            );

            window.location.replace(
                "chat.html"
            );

            return;
        }


        /*
         * Session واقعی دیگر معتبر نیست.
         * localStorage را پاک می‌کنیم تا
         * امنیت ورود حفظ شود.
         */

        if (response.status === 401) {

            localStorage.removeItem(
                "gapino_user"
            );
        }

    } catch (error) {

        console.warn(
            "RESTORE LOGIN ERROR:",
            error
        );

        /*
         * در صورت قطعی موقت اینترنت،
         * فرم ورود را نگه می‌داریم.
         */
    }
}


restoreExistingLogin();

</script>

</body>
</html>
