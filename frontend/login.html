<body>


<div class="box">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">
        GAP
    </div>


    <h1>
        ورود GAPINO
    </h1>


    <!-- =========================
         MOBILE
    ========================== -->

    <input
        id="mobile"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="09120000000"
    >


    <!-- =========================
         SEND CODE
    ========================== -->

    <button
        id="sendCode"
        type="button"
    >
        ارسال کد ورود
    </button>


    <!-- =========================
         CODE
    ========================== -->

    <div
        id="codeBox"
        class="hide"
    >

        <input
            id="code"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="کد ۶ رقمی"
        >


        <button
            id="loginButton"
            type="button"
        >
            ورود
        </button>

    </div>


    <!-- =========================
         TIMER
    ========================== -->

    <div
        id="timer"
        class="timer hide"
    ></div>


    <!-- =========================
         MESSAGE
    ========================== -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- =========================
         REGISTER
    ========================== -->

    <a href="register.html">
        ساخت حساب جدید
    </a>


</div>


<script>

// =====================================================
// API
// =====================================================

const API =
    "https://gapino3.onrender.com";


// =====================================================
// ELEMENTS
// =====================================================

const mobile =
    document.getElementById("mobile");

const code =
    document.getElementById("code");

const sendCode =
    document.getElementById("sendCode");

const loginButton =
    document.getElementById("loginButton");

const codeBox =
    document.getElementById("codeBox");

const message =
    document.getElementById("message");

const timer =
    document.getElementById("timer");


// =====================================================
// STATE
// =====================================================

let currentPhone = "";

let timerInterval = null;


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    type = ""
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}


// =====================================================
// NORMALIZE PHONE
// =====================================================

function normalizePhone(
    value
){

    let phone =
        value
        .trim()
        .replace(/\s+/g, "");


    // +98xxxxxxxxxx
    if(
        phone.startsWith("+98")
    ){

        phone =
            "0" +
            phone.slice(3);

    }


    // 98xxxxxxxxxx
    else if(
        phone.startsWith("98")
    ){

        phone =
            "0" +
            phone.slice(2);

    }


    return phone;
}


// =====================================================
// TIMER
// =====================================================

function startTimer(
    seconds = 60
){

    clearInterval(
        timerInterval
    );


    let remaining =
        seconds;


    sendCode.disabled =
        true;


    timer.classList.remove(
        "hide"
    );


    timer.textContent =
        `ارسال مجدد تا ${remaining} ثانیه`;


    timerInterval =
        setInterval(
            () => {

                remaining--;


                if(
                    remaining <= 0
                ){

                    clearInterval(
                        timerInterval
                    );


                    sendCode.disabled =
                        false;


                    timer.textContent =
                        "اکنون می‌توانید دوباره کد بگیرید";


                    return;

                }


                timer.textContent =
                    `ارسال مجدد تا ${remaining} ثانیه`;

            },
            1000
        );

}


// =====================================================
// SEND CODE
// =====================================================

sendCode.onclick =
    async () => {

        const phone =
            normalizePhone(
                mobile.value
            );


        // -------------------------------
        // CHECK PHONE
        // -------------------------------

        if(
            !/^09\d{9}$/.test(phone)
        ){

            showMessage(
                "شماره موبایل اشتباه است",
                "error"
            );

            return;

        }


        currentPhone =
            phone;


        mobile.value =
            phone;


        sendCode.disabled =
            true;


        showMessage(
            "در حال ارسال کد...",
            ""
        );


        // -------------------------------
        // FORM DATA
        // -------------------------------

        const form =
            new FormData();


        form.append(
            "mobile",
            phone
        );


        try{

            // ---------------------------
            // SEND TO GAPINO
            // ---------------------------

            const res =
                await fetch(
                    API + "/send-code",
                    {
                        method:"POST",
                        body:form,
                        cache:"no-store"
                    }
                );


            // ---------------------------
            // RESPONSE
            // ---------------------------

            const data =
                await res.json();


            // ---------------------------
            // SUCCESS
            // ---------------------------

            if(
                data.success
            ){

                showMessage(
                    "کد ورود به همین شماره پیامک شد",
                    "success"
                );


                codeBox.classList.remove(
                    "hide"
                );


                code.focus();


                startTimer(
                    60
                );


            }

            // ---------------------------
            // FAILED
            // ---------------------------

            else{

                sendCode.disabled =
                    false;


                showMessage(
                    data.message ||
                    "ارسال کد ناموفق بود",
                    "error"
                );

            }


        }

        catch(error){

            console.error(
                "SEND CODE ERROR:",
                error
            );


            sendCode.disabled =
                false;


            showMessage(
                "خطا در ارتباط با سرور",
                "error"
            );

        }

    };


// =====================================================
// VERIFY + LOGIN
// =====================================================

loginButton.onclick =
    async () => {

        const phone =
            currentPhone ||
            normalizePhone(
                mobile.value
            );


        const otp =
            code.value.trim();


        // -------------------------------
        // CHECK PHONE
        // -------------------------------

        if(
            !/^09\d{9}$/.test(phone)
        ){

            showMessage(
                "شماره موبایل اشتباه است",
                "error"
            );

            return;

        }


        // -------------------------------
        // CHECK OTP
        // -------------------------------

        if(
            !/^\d{6}$/.test(otp)
        ){

            showMessage(
                "کد باید ۶ رقمی باشد",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;


        showMessage(
            "در حال بررسی کد...",
            ""
        );


        try{

            // =================================
            // VERIFY CODE
            // =================================

            const verifyForm =
                new FormData();


            verifyForm.append(
                "mobile",
                phone
            );


            verifyForm.append(
                "code",
                otp
            );


            const verify =
                await fetch(
                    API + "/verify-code",
                    {
                        method:"POST",
                        body:verifyForm,
                        cache:"no-store"
                    }
                );


            const verifyData =
                await verify.json();


            if(
                !verifyData.success
            ){

                loginButton.disabled =
                    false;


                showMessage(
                    verifyData.message ||
                    "کد اشتباه است",
                    "error"
                );


                return;

            }


            // =================================
            // LOGIN
            // =================================

            const loginForm =
                new FormData();


            loginForm.append(
                "mobile",
                phone
            );


            const login =
                await fetch(
                    API + "/login",
                    {
                        method:"POST",
                        body:loginForm,
                        credentials:"include",
                        cache:"no-store"
                    }
                );


            const loginData =
                await login.json();


            if(
                loginData.success
            ){

                showMessage(
                    "ورود موفق. انتقال...",
                    "success"
                );


                localStorage.setItem(

                    "gapino_user",

                    JSON.stringify(
                        loginData.user
                    )

                );


                setTimeout(
                    () => {

                        window.location.href =
                            "chat.html";

                    },
                    800
                );


            }

            else{

                loginButton.disabled =
                    false;


                showMessage(
                    loginData.message ||
                    "ورود ناموفق بود",
                    "error"
                );

            }


        }

        catch(error){

            console.error(
                "VERIFY / LOGIN ERROR:",
                error
            );


            loginButton.disabled =
                false;


            showMessage(
                "خطا در ارتباط با سرور",
                "error"
            );

        }

    };


// =====================================================
// ENTER KEY
// =====================================================

mobile.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            sendCode.click();

        }

    }
);


code.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            loginButton.click();

        }

    }
);

</script>

</body>

</html>
